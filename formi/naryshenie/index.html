    <div class="form__group">
      <input type="email" class="form__input" placeholder="ВАША ПОЧТА">
    </div>

    <div class="form__group form__group--row">
      <input type="text" class="form__input" placeholder="URL" style="flex:1;">
      <span class="form__url-note">УКАЖИТЕ ССЫЛКУ НА СТРАНИЦУ С НАРУШЕНИЕМ!</span>
    </div>

    <div class="form__textarea-wrapper">
      <div class="form__textarea-label">НАРУШЕНИЕ</div>
      <textarea class="form__textarea" placeholder=" "></textarea>
    </div>

    <button type="submit" class="form__submit">ОТПРАВИТЬ</button>

  </form>
